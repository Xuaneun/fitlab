<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9ff"><title>FitLab</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#23334a;background:#f5f9ff}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;padding:22px 20px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 15px}.muted{color:#8191a6;font-size:13px}.card{background:white;border:1px solid #eaf0f8;border-radius:22px;padding:21px;margin:16px 0;box-shadow:0 8px 30px #345e9210}.hero{background:linear-gradient(135deg,#eaf5ff,#fff)}.big{font-size:43px;font-weight:750;letter-spacing:-2px;margin:8px 0}.pill{display:inline-block;border-radius:20px;background:#e7f6f1;color:#288b76;padding:6px 10px;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.num{font-size:25px;font-weight:700;margin-top:8px}.primary{background:#397edb;color:white;border:0;border-radius:15px;padding:14px 18px;font-size:15px;font-weight:650;cursor:pointer}.secondary{background:#edf4fd;color:#397edb;border:0;border-radius:13px;padding:11px 13px;cursor:pointer}button{font:inherit;cursor:pointer}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid #e6edf5;display:flex;justify-content:space-around;padding:12px max(12px,calc((100vw - 500px)/2)) calc(12px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#8798ad;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;min-width:70px}.nav button.active{color:#397edb;font-weight:700}.nav .icon{font-size:23px}.screen{display:none}.screen.active{display:block}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0;font-size:13px;color:#52667f}input,select,textarea{width:100%;border:1px solid #dce7f4;border-radius:13px;padding:12px;font:inherit;background:#fbfdff;color:#23334a}textarea{min-height:75px}label.inline{display:flex;gap:8px;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{border:0;border-radius:14px;background:#e9f1fb;padding:10px 13px;color:#56708e}.tabs button.selected{background:#397edb;color:white}.entry{padding:13px 0;border-bottom:1px solid #eef2f8}.entry:last-child{border:0}.entry small{color:#8898aa}.danger{border:0;background:none;color:#b85b65;font-size:12px}.chart{width:100%;height:150px;display:block}.empty{color:#94a3b8;text-align:center;padding:30px 5px}.note{font-size:12px;color:#8291a5;line-height:1.6}.progress{height:9px;background:#e7effa;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#5b9de7;border-radius:10px}.hidden{display:none!important}
</style></head><body><main class="app"><header><div><h1>FitLab <span style="color:#65a6ee">✦</span></h1><div class="muted" id="today"></div></div><span class="pill">我的减脂实验室</span></header>
<section id="home" class="screen active"><div class="card hero"><div class="row"><span class="muted">最近体重</span><span class="pill" id="weightBadge">开始记录吧</span></div><div class="big" id="latestWeight">— <small style="font-size:17px">kg</small></div><div class="muted" id="weightAverage">7日均重 · 暂无数据</div><svg class="chart" id="miniChart" viewBox="0 0 320 150"></svg><button class="secondary" onclick="go('record','weight')">＋ 记录体重</button></div><h2>今天的概况</h2><div class="grid"><div class="card"><div class="muted">💧 饮水</div><div class="num" id="homeWater">0 ml</div><button class="secondary" onclick="quickWater()">＋ 1杯</button></div><div class="card"><div class="muted">🍽️ 已记录摄入</div><div class="num" id="homeCalories">0 kcal</div><div class="note">仅统计已填写热量</div></div></div><div class="card"><div class="row"><div><h2 style="margin:0">今天的记录</h2><div class="muted" id="homeCount"></div></div><button class="primary" onclick="go('record')">＋ 记录</button></div></div></section>
<section id="record" class="screen"><h2 style="margin-top:25px">添加记录</h2><div class="tabs" id="recordTabs"><button data-type="weight">⚖️ 体重</button><button data-type="food">🍚 饮食</button><button data-type="water">💧 饮水</button><button data-type="activity">🏃 运动</button></div><div class="card"><form id="entryForm"><div class="field"><label>记录时间</label><input type="datetime-local" name="time" required></div><div id="weightFields"><div class="field"><label>体重（kg）</label><input name="kg" type="number" min="20" max="350" step="0.01" placeholder="例如 71.0"></div><div class="grid"><div class="field"><label>进食状态</label><select name="mealState"><option value="未记录">未记录</option><option>饭前</option><option>饭后</option></select></div><div class="field"><label>排便状态</label><select name="bowelState"><option value="未记录">未记录</option><option>排便前</option><option>排便后</option></select></div></div></div><div id="foodFields" class="hidden"><div class="field"><label>吃了什么</label><textarea name="food" placeholder="例如：米饭一碗、鸡蛋两个、炒青菜"></textarea></div><div class="grid"><div class="field"><label>估算热量（kcal，可空）</label><input name="kcal" type="number" min="0" step="1"></div><div class="field"><label>饥饿程度（可选）</label><select name="hunger"><option value="">不记录</option><option value="0">0 · 完全不饿</option><option value="2">2</option><option value="4">4</option><option value="6">6</option><option value="8">8</option><option value="10">10 · 非常饿</option></select></div></div><div class="field"><label>进食原因（可选）</label><select name="reason"><option value="">不记录</option><option>生理饥饿</option><option>无聊</option><option>情绪</option><option>奖励</option><option>习惯</option><option>其他</option></select></div><div class="field"><label>心情 / 感受（可选）</label><input name="feeling" placeholder="例如：开心、焦虑、很满足"></div></div><div id="waterFields" class="hidden"><div class="field"><label>饮水量</label><div class="grid"><input name="waterAmount" type="number" min="0.1" step="0.1" value="1"><select name="waterUnit" id="waterUnit"><option value="cup">史丹利杯（30 oz）</option><option value="ml">毫升（ml）</option><option value="oz">液体盎司（oz）</option></select></div></div><div class="note">30 美制液体盎司 ≈ 887 ml。可在设置中调整默认杯容量。</div></div><div id="activityFields" class="hidden"><div class="field"><label>运动类型</label><input name="activity" placeholder="羽毛球 / 跑步 / 快走…"></div><div class="field"><label>运动时长（分钟）</label><input name="minutes" type="number" min="1"></div></div><button class="primary" style="width:100%">保存记录</button></form></div><div class="card"><h2>最近记录</h2><div id="recentEntries"></div></div></section>
<section id="trends" class="screen"><h2 style="margin-top:25px">趋势与全部数据</h2><div class="card"><h2>体重变化</h2><svg class="chart" id="fullChart" viewBox="0 0 320 150"></svg><div class="note" id="trendText"></div></div><div class="grid"><div class="card"><div class="muted">7日平均</div><div class="num" id="trendAvg">—</div></div><div class="card"><div class="muted">累计记录</div><div class="num" id="totalEntries">0</div></div></div><div class="card"><h2>饮水与饮食</h2><div id="detailSummary" class="note"></div></div><div class="card"><h2>全部记录</h2><div id="allEntries"></div></div></section>
<section id="settings" class="screen"><h2 style="margin-top:25px">我的设置</h2><div class="card"><div class="field"><label>史丹利杯容量（美制液体盎司）</label><input type="number" id="cupOz" min="1" step="0.1" value="30"></div><button class="primary" onclick="saveSettings()">保存设置</button><div class="note" style="margin-top:10px">30 oz ≈ 887 ml，按水的体积计算。</div></div><div class="card"><h2>本地数据管理</h2><p class="note">数据只存储在当前浏览器。更换手机、清理网站数据或使用无痕模式可能造成数据丢失。请定期导出备份。</p><button class="primary" onclick="exportData()">导出 JSON 备份</button><div class="field"><label>从备份恢复（会替换当前记录）</label><input type="file" id="importFile" accept="application/json,.json"></div></div></section></main>
<nav class="nav"><button data-page="home" class="active"><span class="icon">⌂</span>首页</button><button data-page="record"><span class="icon">⊕</span>记录</button><button data-page="trends"><span class="icon">⌁</span>趋势</button><button data-page="settings"><span class="icon">⚙</span>设置</button></nav><script>
const KEY='fitlab-v1',SET='fitlab-settings-v1';let records=[],settings={cupOz:30},type='weight';try{records=JSON.parse(localStorage.getItem(KEY)||'[]');settings={...settings,...JSON.parse(localStorage.getItem(SET)||'{}')}}catch(e){alert('读取本地数据失败，请先备份后再操作。')}const $=id=>document.getElementById(id);const localDate=d=>{let x=new Date(d),p=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`};const localTime=()=>{let x=new Date(),p=n=>String(n).padStart(2,'0');return `${localDate(x)}T${p(x.getHours())}:${p(x.getMinutes())}`};const day=()=>localDate(new Date());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('保存失败，可能是浏览器存储空间不足。请导出备份。');return false}}function go(page,recordType){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===page));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(recordType)setType(recordType);window.scrollTo(0,0);render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function setType(t){type=t;document.querySelectorAll('#recordTabs button').forEach(b=>b.classList.toggle('selected',b.dataset.type===t));['weight','food','water','activity'].forEach(x=>$(x+'Fields').classList.toggle('hidden',x!==t));$('entryForm').elements.time.value=localTime()}document.querySelectorAll('#recordTabs button').forEach(b=>b.onclick=()=>setType(b.dataset.type));function ml(amount,unit){return unit==='cup'?amount*settings.cupOz*29.5735295625:unit==='oz'?amount*29.5735295625:amount}function add(r){records.push({...r,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())});if(!persist()){records.pop();return}render()}$('entryForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r={type,time:f.get('time')};if(!r.time)return;if(type==='weight'){let v=Number(f.get('kg'));if(!v||v<20||v>350)return alert('请填写有效体重');Object.assign(r,{kg:v,mealState:f.get('mealState'),bowelState:f.get('bowelState')})}if(type==='food'){if(!String(f.get('food')).trim())return alert('请填写食物');Object.assign(r,{food:String(f.get('food')).trim(),kcal:f.get('kcal')===''?null:Number(f.get('kcal')),hunger:f.get('hunger'),reason:f.get('reason'),feeling:f.get('feeling')})}if(type==='water'){let v=Number(f.get('waterAmount'));if(v<=0)return alert('请填写饮水量');Object.assign(r,{amount:v,unit:f.get('waterUnit'),ml:Math.round(ml(v,f.get('waterUnit')))})}if(type==='activity'){if(!String(f.get('activity')).trim()||Number(f.get('minutes'))<=0)return alert('请填写运动类型和时长');Object.assign(r,{activity:f.get('activity'),minutes:Number(f.get('minutes'))})}add(r);e.target.reset();setType(type);alert('已保存 ✓')};function quickWater(){add({type:'water',time:localTime(),amount:1,unit:'cup',ml:Math.round(ml(1,'cup'))})}function remove(id){if(!confirm('确定删除这条记录吗？'))return;records=records.filter(r=>r.id!==id);persist();render()}function describe(r){let s=r.type==='weight'?`${r.kg} kg · ${r.mealState} · ${r.bowelState}`:r.type==='food'?`${esc(r.food)}${r.kcal===null?'':' · '+r.kcal+' kcal'}${r.reason?' · '+esc(r.reason):''}`:r.type==='water'?`${r.ml} ml`: `${esc(r.activity)} · ${r.minutes} 分钟`;return s}function entries(target,data){$(target).innerHTML=data.length?data.map(r=>`<div class="entry"><div class="row"><div><strong>${{weight:'⚖️',food:'🍽️',water:'💧',activity:'🏃'}[r.type]} ${describe(r)}</strong><br><small>${esc(r.time.replace('T',' '))}</small></div><button class="danger" data-delete="${esc(r.id)}">删除</button></div></div>`).join(''):'<div class="empty">还没有记录</div>';$(target).querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}function weightDays(){let m=new Map;records.filter(r=>r.type==='weight').sort((a,b)=>a.time.localeCompare(b.time)).forEach(r=>m.set(r.time.slice(0,10),r.kg));return [...m].map(([date,kg])=>({date,kg}))}function chart(id,arr){let svg=$(id);if(!arr.length){svg.innerHTML='<text x="160" y="78" text-anchor="middle" fill="#9aaabd" font-size="13">记录体重后显示趋势</text>';return}let vals=arr.slice(-30),min=Math.min(...vals.map(x=>x.kg))-.5,max=Math.max(...vals.map(x=>x.kg))+.5,points=vals.map((v,i)=>`${20+(vals.length===1?140:i*280/(vals.length-1))},${125-(v.kg-min)/(max-min)*100}`).join(' ');svg.innerHTML=`<line x1="20" y1="125" x2="300" y2="125" stroke="#e1ebf7"/><polyline points="${points}" fill="none" stroke="#5599e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${20+(vals.length===1?140:i*280/(vals.length-1))}" cy="${125-(v.kg-min)/(max-min)*100}" r="3.5" fill="#5599e9"/>`).join('')}`}function render(){let sorted=[...records].sort((a,b)=>b.time.localeCompare(a.time)),today=sorted.filter(r=>r.time.slice(0,10)===day()),weights=weightDays(),recent=sorted.find(r=>r.type==='weight'),seven=weights.filter(r=>r.date>=localDate(Date.now()-6*86400000)&&r.date<=day()),avg=seven.length?seven.reduce((s,r)=>s+r.kg,0)/seven.length:null;let w=today.filter(r=>r.type==='water').reduce((s,r)=>s+r.ml,0),food=today.filter(r=>r.type==='food'),k=food.reduce((s,r)=>s+(r.kcal??0),0);$('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('latestWeight').innerHTML=recent?`${recent.kg.toFixed(1)} <small style="font-size:17px">kg</small>`:'— <small style="font-size:17px">kg</small>';$('weightBadge').textContent=recent?'持续观察，不急于评价':'开始记录吧';$('weightAverage').textContent=avg?`最近7个自然日的记录均值 ${avg.toFixed(2)} kg（${seven.length}天）`:'7日均重 · 暂无数据';$('homeWater').textContent=Math.round(w)+' ml';$('homeCalories').textContent=k+' kcal';$('homeCount').textContent=`今天已保存 ${today.length} 条记录`;$('trendAvg').textContent=avg?avg.toFixed(2)+' kg':'—';$('totalEntries').textContent=records.length;$('trendText').textContent='每日采用最后一次称重；不同进食和排便状态会影响可比性。';$('detailSummary').textContent=`今天饮水 ${Math.round(w)} ml；饮食记录 ${food.length} 条，其中 ${food.filter(r=>r.kcal!==null).length} 条填写了热量。未记录的食物不计入摄入统计。`;chart('miniChart',weights);chart('fullChart',weights);entries('recentEntries',sorted.slice(0,8));entries('allEntries',sorted);$('cupOz').value=settings.cupOz}function saveSettings(){let v=Number($('cupOz').value);if(!v||v<=0||v>200)return alert('请输入合理杯容量');settings.cupOz=v;localStorage.setItem(SET,JSON.stringify(settings));alert('已保存。新记录将使用新的杯容量。')}function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),records,settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`fitlab-backup-${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.records)||!d.records.every(r=>r&&typeof r.type==='string'&&typeof r.time==='string'))throw Error('格式不正确');if(!confirm(`将用备份中的 ${d.records.length} 条记录替换现有记录，继续吗？`))return;let old=records;records=d.records;if(!persist()){records=old;return}settings={cupOz:30,...d.settings};localStorage.setItem(SET,JSON.stringify(settings));render();alert('恢复成功')}catch(err){alert('恢复失败：'+err.message)}e.target.value=''};setType('weight');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
